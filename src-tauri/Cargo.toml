[package]
name = "md-viewer"
version = "0.2.0"
description = "A fast, minimal desktop Markdown viewer and editor"
authors = ["Alberto Alonso"]
license = "MIT"
repository = "https://github.com/akaneghro/md-viewer"
homepage = "https://github.com/akaneghro/md-viewer"
edition = "2021"
rust-version = "1.90"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = "2"
